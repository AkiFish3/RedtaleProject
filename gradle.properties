# RedtaleProject 构建变量
# 改这里就够，build.gradle 只读这些

mod_id=redtale_project
mod_name=RedtaleProject
mod_version=0.1.0
mod_group=com.redtale.project

# 与正式服 / 测试服完全同版
minecraft_version=1.21.1
neo_version=21.1.257

# 编译 classpath 来源：直接吃服务端 libraries（不必等 neoform-runtime 镜像）
# 想改成正式服的库就写 E:/server-1.21.1/libraries
neoforge_libraries=E:/server-test/libraries

# MDG 版本（build-mdg.gradle.disabled 里用；主构建已不依赖它）
moddevgradle_version=2.0.148

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
